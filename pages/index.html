<script>
({
    meta: {
        title:       'Minnow Framework | Home',
        description: 'Minnow is a tiny, zero dependency, no build framework with Vue-inspired single-file components, reactive data, client-side routing, no dependencies, no build tools — all in vanilla JS.',
        image:       'https://mysite.com/og/home.png',
    },
    data() {
        return {
            count: 0
        }
    },
    methods: {
        increment() {
            this.data.count++;
            this.data.$store.set('count', this.data.count);
        },
        decrement() {
            this.data.count--;
            this.data.$store.set('count', this.data.count);
        },
        resetCount() {
            this.data.count = 0;
            this.data.$store.remove('count');
        }
    },
    mounted() {
        // Restore persisted count — default 0 if never set
        this.data.count = this.data.$store.get('count', 0);
    }
})
</script>
