<template>
    <div class="d-flex flex-column min-vh-100">
        <div class="container py-5 flex-grow-1 mt-5">
            <div class="text-center mb-5">
                <h1 class="fw-bold display-5">Remote Blog</h1>
                <p class="text-muted">
                    Live data from
                    <code class="bg-light border rounded px-2 py-1">dummyjson.com/posts</code>
                </p>
            </div>

            <div v-if="loading" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
                <div class="col" v-for="n in skeletons">
                    <div class="card h-100 border-0 shadow-sm rounded-4">
                        <div class="card-body p-4">
                            <div class="placeholder-glow mb-3">
                                <span class="placeholder col-3 rounded-pill me-2"></span>
                                <span class="placeholder col-2 rounded-pill"></span>
                            </div>
                            <div class="placeholder-glow mb-2">
                                <span class="placeholder col-10"></span>
                                <span class="placeholder col-7"></span>
                            </div>
                            <div class="placeholder-glow mt-3">
                                <span class="placeholder col-12"></span>
                                <span class="placeholder col-10"></span>
                                <span class="placeholder col-8"></span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div v-if="!loading" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
                <div class="col" v-for="post in posts">
                    <div class="card h-100 border-0 shadow-sm rounded-4">
                        <div class="card-body d-flex flex-column p-4">
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <span class="badge rounded-pill" style="background:#e0e7ff;color:#4f46e5">{{post.tags}}</span>
                                <small class="text-muted">{{post.views}} views</small>
                            </div>
                            <h5 class="card-title fw-semibold">
                                <a href="/blog-remote/{{post.slug}}" class="text-dark text-decoration-none stretched-link">{{post.title}}</a>
                            </h5>
                            <p class="card-text text-muted flex-grow-1 small">{{post.body}}</p>
                            <div class="d-flex justify-content-between align-items-center pt-3 border-top mt-auto">
                                <div class="d-flex gap-3">
                                    <small class="text-muted">👍 {{post.reactions.likes}}</small>
                                    <small class="text-muted">👎 {{post.reactions.dislikes}}</small>
                                </div>
                                <a href="/blog-remote/{{post.slug}}" class="text-primary fw-semibold small text-decoration-none">Read more →</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</template>

<script>
({
        meta: {
        title:       'Blog Remote | Minnow Framework ',
        description: 'News and Docs',
        image:       'https://mysite.com/og/about.png',
    },
    data() {
        return {
            posts: [],
            loading: true,
            skeletons: [1,2,3,4,5,6],
            year: new Date().getFullYear()
        }
    },
    async mounted() {
        const slugify = t => t.toLowerCase().trim().replace(/[^a-z0-9\s-]/g,'').replace(/\s+/g,'-');
        const data = await this.data.$store.fetch('https://dummyjson.com/posts?limit=12');
        this.data.posts = data.posts.map(p => ({ ...p, slug: slugify(p.title) }));
        this.data.loading = false;
    }
})
</script>
