<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"> -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <title>Minnow Framework</title>
    <meta name="description" content="Default description">
    <meta property="og:site_name" content="Minnow Framework">
    <meta name="twitter:site" content="@mysite">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            color: #333;
        }

        #app {
            min-height: 100vh;
        }

        .page-transition-enter {
            opacity: 0;
            transform: translateY(20px);
        }

        .page-transition-enter-active {
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .page-transition-exit {
            opacity: 1;
        }

        .page-transition-exit-active {
            opacity: 0;
            transition: opacity 0.3s ease;
        }
    </style>
</head>
<body>
    <div data-component="navbar"></div>  <!-- rendered once, never touched by router -->
    <div id="app"></div>
    <div data-component="footer"></div>
    <script type="module">
        import { parseSFC, createApp } from './lib/framework.js';
        import { router } from './lib/router.js';

        // Render persistent components directly into the shell
        parseSFC('/components/navbar.html').then(c => {
            c.render(document.querySelector('[data-component="navbar"]'));
            router.registerComponent(c, '/components/navbar.html');
        });
        parseSFC('/components/footer.html').then(c => c.render(document.querySelector('[data-component="footer"]')));
        const app = createApp('#app', router);
        app.mount();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
</body>
</html>
